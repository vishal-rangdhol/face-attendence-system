# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  path_filters:
    - "!node_modules/**"
    - "!.expo/**"
    - "!android/**"
    - "!ios/**"
    - "!dist/**"
    - "!**/*.lock"
    - "!**/*.lockb"
    - "!couchbase_data/**"

  path_instructions:
    - path: "**"
      instructions: |
        Adopt a senior engineer mindset:
        - Value the smallest change that fully solves the problem.
        - Flag over-engineering, unnecessary abstractions, or new dependencies where standard library or existing code suffices.
        - Verify edge cases, error handling, and trust boundaries.

    - path: "backend/**"
      instructions: |
        - Architecture: Bun runtime + Hono web framework + Couchbase Server.
        - Scope Boundary: Strictly a personal attendance system. Reject any introduction of Redis, JWT, organizational roles/hierarchies, or GPS geofencing.
        - Validation: All route request bodies must be strictly validated using Zod schemas.
        - Timestamps & Timezones: Ensure server timestamps are generated in UTC (`toISOString()`), and attendance calendar dates (`YYYY-MM-DD`) are computed in the user's configured IANA timezone.
        - Database Integrity: Couchbase operations must use parameterized queries (`$key`, `$doc`). Ensure attendance duplicate prevention is enforced atomically at the database key level (`att::<userId>::<YYYY-MM-DD>`).
        - Trust Model: Do not treat the client-submitted `verifiedOnDevice` flag as cryptographic proof of identity.

    - path: "mobile/**"
      instructions: |
        - Compatibility: Expo SDK 54, React Native 0.81 (New Architecture).
        - Biometric Privacy: Face detection (Google ML Kit) and face embedding extraction (MobileFaceNet via TensorFlow Lite) must occur STRICTLY ON-DEVICE. Reject any code that attempts to transmit raw facial images over the network.
        - Component Separation: Google ML Kit face detection and MobileFaceNet recognition must remain distinct, decoupled components.
        - Thresholds: Ensure the face similarity threshold is configurable (baseline: 0.88).
        - Data Hygiene: Sensitive local credentials and biometric embeddings must use `expo-secure-store` and support full biometric deletion.

    - path: "infrastructure/**"
      instructions: |
        - Ensure Docker Compose and Couchbase provisioning scripts remain self-contained, independent, and maintainable.
        - Ensure database credentials and ports are configurable via environment variables.

chat:
  auto_reply: true
